<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Advent+Pro:ital,wght@0,100..900;1,100..900&family=Happy+Monkey&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karla:ital,wght@0,200..800;1,200..800&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Metric/Imeprial Unit Converter</title>
  </head>
  <body>
    <div class="main">
      <div class="header">
        <h1>Metric/Imperial Unit Conversion</h1>
        <input type="text" id="inputValue">
        <button id="convertBtn">Convert</button>
      </div>
      <div class="converter">
        <!--Length-->
        <div id="length" class="conversion">
          <h2>Length (Meter/Feet)</h2>
          <p id="lengthResult">meters = feet | feet = meters </p>
        </div>

        <!--Volume-->
        <div id="volume" class="conversion">
          <h2>Volume (Liters/Gallons)</h2>
          <p id="volumeResult">liters = gallons | gallons = liters</p>
        </div>

        <!--Mass-->
        <div id="mass" class="conversion">
          <h2>Mass (Kilograms/Pounds)</h2>
          <p id="massResult">kilos = pounds | pounds = kilos</p>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
