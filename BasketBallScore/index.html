<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="style.css" />
    <title>BasketBall Score Card</title>
  </head>
  <body>

    <div class="container">
      <div class="scorecard">
        <div id="home">
          <h1 class="team">Home</h1>
          <div class="score" id="home-score">0</div>

          <div class="controls-container">
            <button id="home-1" class="controls" onclick="add1PointHome()">+1</button>
            <button id="home-2" class="controls" onclick="add2PointHome()">+2</button>
            <button id="home-3" class="controls" onclick="add3PointHome()">+3</button>
          </div>
        </div>

        <div id="guest">
          <h1 class="team">Guest</h1>
          <div class="score" id="guest-score">0</div>

          <div class="controls-container">
            <button id="guest-1" class="controls" onclick="add1PointGuest()">+1</button>
            <button id="guest-2" class="controls" onclick="add2PointGuest()">+2</button>
            <button id="guest-3" class="controls" onclick="add3PointGuest()">+3</button>
          </div>
        </div>
      </div>

      <div class="reset-container">
        <button id="reset" class="controls" onclick="resetScore()">Reset</button>
      </div>

    </div>

    <script src="index.js"></script>
  </body>
</html>
